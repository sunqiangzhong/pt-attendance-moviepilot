<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT 签到助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">ATTENDANCE CONTROL</p>
        <h1>PT 签到助手</h1>
        <p class="lead">浏览器保持运行，签到页由扩展自动打开。</p>
      </div>
      <div class="version">EXT / 0.2.0</div>
    </header>

    <section class="grid">
      <div id="site-list" class="site-list"></div>

      <article class="card notify-card">
        <div class="card-head">
          <div>
            <span class="tag">AGENT / NOTIFY</span>
            <h2>MoviePilot</h2>
          </div>
          <label class="switch">
            <input id="mp-enabled" type="checkbox">
            <span></span>
          </label>
        </div>

        <label class="field">
          <span>MoviePilot 地址</span>
          <input id="mp-url" placeholder="http://192.168.5.6:3000">
        </label>

        <label class="field">
          <span>MsgNotify API 令牌</span>
          <input id="mp-key" type="password" autocomplete="off">
        </label>

        <label class="field">
          <span>Agent Path</span>
          <input id="agent-path" value="/api/v1/message/agent/stream">
        </label>

        <label class="field">
          <span>Agent Bearer Token</span>
          <input id="agent-token" type="password" autocomplete="off">
        </label>

        <p class="note">开关只控制结果通知。Agent 配置供 HDSky、OpenCD、U2 和 CHDBits 使用。</p>
      </article>
    </section>

    <footer class="actions">
      <p id="save-state">配置保存在当前浏览器</p>
      <button class="btn primary" id="save" type="button">保存设置</button>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
